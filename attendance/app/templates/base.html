<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}출퇴근 관리{% endblock %}</title>
  <style>
    :root {
      --ink: #1c1c1c; --muted: #736e66; --surface: #faf7f3;
      --line: #e8e3dc; --coral: #e04a3f; --warn: #fff3cd; --ok: #2f7d4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Noto Sans KR", sans-serif;
      color: var(--ink); background: #fff; font-size: 15px; line-height: 1.5;
    }
    header {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
    }
    header h1 { font-size: 17px; margin: 0 16px 0 0; }
    header a { color: var(--ink); text-decoration: none; font-size: 14px; }
    header a:hover { text-decoration: underline; }
    main { padding: 20px; max-width: 1200px; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    h2:first-child { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { background: var(--surface); font-weight: 600; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .warn { background: var(--warn); }
    .muted { color: var(--muted); font-size: 13px; }
    .ok { color: var(--ok); }
    .bad { color: var(--coral); }
    .badge {
      display: inline-block; padding: 1px 7px; border-radius: 999px;
      font-size: 12px; background: var(--line);
    }
    .badge.review { background: var(--coral); color: #fff; }
    form.inline { display: inline-flex; gap: 4px; align-items: center; }
    input, button, select {
      font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    button { cursor: pointer; background: var(--ink); color: #fff; border-color: var(--ink); }
    button.ghost { background: #fff; color: var(--ink); }
    .empty { color: var(--muted); padding: 12px 0; }
    .cards { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 120px; }
    .card b { display: block; font-size: 22px; }
  </style>
</head>
<body>
  <header>
    <h1>출퇴근 관리</h1>
    <a href="/">오늘 현황</a>
    <a href="/work-days">월별 기록</a>
    <a href="/employees">직원</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
